name: Daily 444, 555 and frozen V2 research

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Retrain completed 444/555 runs; published V2.11 signals remain immutable'
        type: boolean
        default: false
  schedule:
    # UTC 09:37 / 13:37 = Taipei 17:37 / 21:37. The second run retries missing data.
    # The morning retry recovers delayed jobs even after the Taipei date changes.
    # GitHub cron can be delayed; select the latest completed XTAI session.
    - cron: '37 9 * * 1-5'
    - cron: '37 13 * * 1-5'
    - cron: '17 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-lstm.yml'
      - 'scripts/**'
      - 'dashboard/**'
      - 'dashboard_v2/data_access/**'
      - 'notebooks/**'
      - 'experiments/**/*.py'
      - 'models/**'
      - 'common/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: daily-lstm-main
  cancel-in-progress: false

jobs:
  daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: '1'
      LSTM_SAVE_MODELS: '1'
      MPLBACKEND: Agg
      USE_TF: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TW_LSTM_MARKET_TIMEOUT_SECONDS: '1800'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Cache downloaded Chinese sentiment model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: huggingface-erlangshen-roberta-110m-sentiment-v1
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
      - name: Check saved project health before updating sources
        run: python -m scripts.project_health --profile core
      - name: Run isolated unit checks
        run: python -m pytest -q
      - name: Verify frozen model hashes and TensorFlow loading
        run: python -m scripts.verify_models
      - name: Update shared sources and run the four systems
        id: daily
        timeout-minutes: 270
        env:
          FORCE_RERUN: ${{ inputs.force || false }}
        shell: bash
        run: |
          mkdir -p logs
          args=(--mode full)
          if [[ "$FORCE_RERUN" == 'true' ]]; then
            args+=(--force)
          fi
          set +e
          set -o pipefail
          python -m scripts.run_all_daily "${args[@]}" 2>&1 | tee logs/pipeline.log
          result="${PIPESTATUS[0]}"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          # Persist valid partial results first. The final step reports waiting/failure.
          exit 0
      - name: Check updated project health before publishing state
        id: updated_health
        if: always() && (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
        run: python -m scripts.project_health --profile core
      - name: Capture display-only news titles for the project website
        if: always() && (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p logs
          python -m scripts.capture_news_display --capture --limit 50 > logs/news-display-capture.json
      - name: Persist validated state, including partial progress
        id: persist
        if: always() && (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure') && steps.updated_health.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scripts.persist_daily_state --commit --push
      - name: Upload complete outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-lstm-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            logs/
            outputs/
            reports/daily/
            reports/attempts/
            reports/latest/
            data/snapshots/
            experiments/results/v2/v211/status.json
      - name: Report complete, waiting or failed
        if: always() && (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
        env:
          PIPELINE_EXIT: ${{ steps.daily.outputs.exit_code }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          UPDATED_HEALTH_OUTCOME: ${{ steps.updated_health.outcome }}
        shell: bash
        run: |
          {
            echo '### Daily research run'
            echo "Pipeline exit code: ${PIPELINE_EXIT:-unavailable} (0 research complete, possibly with an explicitly deferred tracker; 2 waiting; 1 failed)."
            echo "Updated state health: $UPDATED_HEALTH_OUTCOME."
            echo "State persistence: $PERSIST_OUTCOME."
            echo 'Full outputs and logs are attached as the daily-lstm artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('logs/orchestrator/latest_summary.json')
          if path.is_file():
              run = json.loads(path.read_text(encoding='utf-8'))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write(f"\nActual run date: {run.get('run_date')}; data session: {run.get('completed_session')}.\n")
                  output.write(f"\nResearch outcome: {run.get('status')}.\n")
                  if run.get('status') == 'research_complete_tracker_deferred':
                      output.write('\n444/555 research completed. The frozen tracker performed maintenance only and did not backfill a historical signal.\n')
                  attempt = (run.get('reports') or {}).get('attempt_journal')
                  if attempt:
                      output.write(f"\nPermanent attempt journal: `{attempt}`.\n")
          PY
          if [[ "$UPDATED_HEALTH_OUTCOME" != 'success' ]]; then
            echo 'Updated state failed its health contract and was not published. Inspect the updated health check and attached outputs before retrying.'
            exit 1
          fi
          if [[ "$PERSIST_OUTCOME" != 'success' ]]; then
            echo 'State persistence failed; inspect the persistence step before retrying.'
            exit 1
          fi
          case "$PIPELINE_EXIT" in
            0) exit 0 ;;
            2) echo 'Waiting: completed-session prices or news are not ready. The next scheduled run will retry.'; exit 2 ;;
            *) echo 'Pipeline failed or timed out. Valid partial state was preserved when possible.'; exit 1 ;;
          esac
